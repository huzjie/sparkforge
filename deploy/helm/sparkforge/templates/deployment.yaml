apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sparkforge
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-sparkforge
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-sparkforge
    spec:
      containers:
        - name: sparkforge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          resources: {{ toYaml .Values.resources | nindent 12 }}
