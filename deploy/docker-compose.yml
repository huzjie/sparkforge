version: "3.9"
services:
  sparkforge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SPARKFORGE_OPENAI_BASE=http://sparkforge:8000/v1
    command: ["python", "-m", "sparkforge.cli", "serve", "--config", "configs/default.yaml"]
